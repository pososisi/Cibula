<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#2E0F5C">
<style type="text/css">
html {
	height: 100%;
	overflow: hidden;
	background-color: #2E0F5C;
}

body {
	margin: 0;
	height: 100%;
	overflow: hidden;
	color: #fff;
	font-family: -apple-system, "Helvetica Neue", sans-serif;
	background-color: #2E0F5C;
	background-image: linear-gradient(180deg, #2E0F5C 0%, #2E0F5C 26%, #26232E 60%, #232229 88%, #2E0F5C 100%);
	-webkit-text-size-adjust: 100%;
	-webkit-tap-highlight-color: transparent;
}

/* The top 84px are kept free for the search field of the app. */
.page {
	box-sizing: border-box;
	height: 100%;
	padding: 84px 16px 14px;
	display: flex;
	flex-direction: column;
	justify-content: space-between;
}

.fav {
	display: grid;
	grid-template-columns: repeat(3, 1fr);
	gap: 20px 8px;
}

.fav a {
	display: block;
	text-align: center;
	text-decoration: none;
	color: rgba(255, 255, 255, .86);
	font-size: 13px;
	line-height: 1.25;
}

.fav img {
	display: block;
	width: 64px;
	height: 64px;
	margin: 0 auto 8px;
	background-color: rgba(255, 255, 255, .92);
	border-radius: 18px;
}

.donate {
	padding: 16px;
	border-radius: 22px;
	background-color: rgba(255, 255, 255, .08);
	border: 1px solid rgba(210, 176, 255, .25);
}

.donate-top {
	display: flex;
	align-items: flex-start;
}

.donate-top svg {
	flex: none;
	width: 30px;
	height: 30px;
	margin-right: 14px;
	fill: #FF5C8A;
}

.donate-title {
	font-size: 17px;
	font-weight: 700;
}

.donate-text {
	margin-top: 3px;
	font-size: 14px;
	line-height: 1.3;
	color: rgba(255, 255, 255, .7);
}

.donate-btn {
	display: block;
	margin-top: 14px;
	padding: 14px 0;
	border-radius: 14px;
	background-color: #8B2CF5;
	color: #fff;
	font-size: 17px;
	font-weight: 700;
	text-align: center;
	text-decoration: none;
}
</style>
</head>
<body>
<div class="page">

	<div class="fav" style="{{ bookmarks_table_style }}">
		<a href="{{ bookmark_url_0 }}"><img src="{{ bookmark_icon_0 }}" alt="">{{ bookmark_name_0 }}</a>
		<a href="{{ bookmark_url_1 }}"><img src="{{ bookmark_icon_1 }}" alt="">{{ bookmark_name_1 }}</a>
		<a href="{{ bookmark_url_2 }}"><img src="{{ bookmark_icon_2 }}" alt="">{{ bookmark_name_2 }}</a>
		<a href="{{ bookmark_url_3 }}"><img src="{{ bookmark_icon_3 }}" alt="">{{ bookmark_name_3 }}</a>
		<a href="{{ bookmark_url_4 }}"><img src="{{ bookmark_icon_4 }}" alt="">{{ bookmark_name_4 }}</a>
		<a href="{{ bookmark_url_5 }}"><img src="{{ bookmark_icon_5 }}" alt="">{{ bookmark_name_5 }}</a>
	</div>

	<div class="donate">
		<div class="donate-top">
			<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
			<div>
				<div class="donate-title" data-t="title">Support Cibula</div>
				<div class="donate-text" data-t="text">Cibula is free. Help it grow.</div>
			</div>
		</div>
		<a class="donate-btn" href="javascript:showDonate()" data-t="button">Donate</a>
	</div>

</div>

<!-- Only used to find out the language of the app: this text is translated by the app. -->
<span id="probe" hidden>{{ Subscribe to Tor Newsletter }}</span>

<script>
(function () {
	var probe = (document.getElementById('probe') || {}).textContent || '';
	var lang = /[іїєґІЇЄҐ]/.test(probe) ? 'uk' : (/[а-яёА-ЯЁ]/.test(probe) ? 'ru' : 'en');

	var texts = {
		en: { title: 'Support Cibula', text: 'Cibula is free. Help it grow.', button: 'Donate' },
		ru: { title: 'Поддержать Cibula', text: 'Cibula бесплатна. Помогите ей расти.', button: 'Пожертвовать' },
		uk: { title: 'Підтримати Cibula', text: 'Cibula безкоштовна. Допоможіть їй рости.', button: 'Пожертвувати' }
	};

	var nodes = document.querySelectorAll('[data-t]');

	for (var i = 0; i < nodes.length; i++) {
		nodes[i].textContent = texts[lang][nodes[i].getAttribute('data-t')];
	}
})();
</script>
</body>
</html>
