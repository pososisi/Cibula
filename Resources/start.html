<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#2E0F5C">
<style type="text/css">
html {
	height: 100%;
	overflow: hidden;
	background-color: #2E0F5C;
}

body {
	margin: 0;
	height: 100%;
	overflow: hidden;
	color: #fff;
	font-family: -apple-system, "Helvetica Neue", sans-serif;
	background-color: #2E0F5C;
	background-image: linear-gradient(180deg, #2E0F5C 0%, #2E0F5C 26%, #26232E 60%, #232229 88%, #2E0F5C 100%);
	-webkit-text-size-adjust: 100%;
	-webkit-tap-highlight-color: transparent;
}

.page {
	box-sizing: border-box;
	height: 100%;
	padding: 0 16px 14px;
	display: flex;
	flex-direction: column;
	justify-content: space-between;
}

/* Title 60-116, search field of the app 148-200, favorites from 228 (all in points from the top of the page). */
.top {
	padding-top: 60px;
}

.title {
	height: 56px;
	line-height: 56px;
	text-align: center;
	font-size: 46px;
	font-weight: 800;
	letter-spacing: -1px;
}

.search-slot {
	height: 52px;
	margin-top: 32px;
}

.fav {
	display: grid;
	grid-template-columns: repeat(4, 1fr);
	gap: 20px 4px;
	margin-top: 28px;
}

.fav a {
	display: block;
	text-align: center;
	text-decoration: none;
	color: rgba(255, 255, 255, .86);
	font-size: 12px;
	line-height: 1.25;
}

.ico {
	display: flex;
	align-items: center;
	justify-content: center;
	width: 60px;
	height: 60px;
	margin: 0 auto 7px;
	border-radius: 17px;
	color: #fff;
	font-size: 26px;
	font-weight: 800;
}

.name {
	display: block;
	overflow: hidden;
	white-space: nowrap;
	text-overflow: ellipsis;
	padding: 0 2px;
}

.donate {
	position: relative;
	padding: 16px;
	border-radius: 22px;
	background-color: rgba(255, 255, 255, .08);
	border: 1px solid rgba(210, 176, 255, .25);
}

.donate-top {
	display: flex;
	align-items: flex-start;
	padding-right: 30px;
}

.donate-top svg {
	flex: none;
	width: 30px;
	height: 30px;
	margin-right: 14px;
	fill: #FF5C8A;
}

.donate-title {
	font-size: 17px;
	font-weight: 700;
}

.donate-text {
	margin-top: 3px;
	font-size: 14px;
	line-height: 1.3;
	color: rgba(255, 255, 255, .7);
}

.donate-btn {
	display: block;
	margin-top: 14px;
	padding: 14px 0;
	border-radius: 14px;
	background-color: #8B2CF5;
	color: #fff;
	font-size: 17px;
	font-weight: 700;
	text-align: center;
	text-decoration: none;
}

.x {
	position: absolute;
	top: 10px;
	right: 10px;
	width: 28px;
	height: 28px;
	padding: 0;
	border: 0;
	border-radius: 14px;
	background-color: rgba(255, 255, 255, .12);
	color: rgba(255, 255, 255, .8);
	font-size: 15px;
	line-height: 28px;
}
</style>
</head>
<body>
<div class="page">

	<div class="top">
		<div class="title">Cibula</div>

		<!-- The search field is part of the app and sits exactly here. -->
		<div class="search-slot"></div>

		<div class="fav" style="{{ bookmarks_table_style }}">
			<a href="https://onion.my/"><div class="ico" style="background: linear-gradient(160deg, #35D07F, #1B8F52);">O</div><span class="name">onion.my</span></a>
			<a href="http://juhanurmihxlp77nkq76byazcldy2hlmovfu2epvl5ankdibsot4csyd.onion/"><div class="ico" style="background: linear-gradient(160deg, #8456C9, #3C1D70);">A</div><span class="name">Ahmia</span></a>
			<a href="http://bbcnewsd73hkzno2ini43t4gblxvycyac5aw4gnv7t2rccijh7745uqd.onion/"><div class="ico" style="background: #fff; color: #000; font-size: 21px; letter-spacing: 1px;">BBC</div><span class="name">BBC</span></a>
			<a href="http://p53lf57qovyuvwsc6xnrppyply3vtqm7l6pcobkmyqsiofyeznfu5uqd.onion/"><div class="ico" style="background: linear-gradient(160deg, #2F4A7D, #162340);">P</div><span class="name">ProPublica</span></a>
			<a href="https://www.legalizer.cc/"><div class="ico" style="background: linear-gradient(160deg, #FF9A3D, #D4571A);">L</div><span class="name">Legalizer</span></a>
			<a href="http://bj5hp4onm4tvpdb5rzf4zsbwoons67jnastvuxefe4s3v7kupjhgh6qd.onion/"><div class="ico" style="background: linear-gradient(160deg, #2FC7C7, #17807F);">B</div><span class="name">bj5hp4…</span></a>
			<a href="http://tordexu73joywapk2txdr54jed4imqledpcvcuf75qsas2gwdgksvnyd.onion/"><div class="ico" style="background: linear-gradient(160deg, #E0509C, #9B2A6B);">T</div><span class="name">tordexu…</span></a>
		</div>
	</div>

	<div class="donate" id="donate">
		<button class="x" type="button" onclick="hideDonate()" aria-label="Close">&#10005;</button>
		<div class="donate-top">
			<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
			<div>
				<div class="donate-title" data-t="title">Support Cibula</div>
				<div class="donate-text" data-t="text">Cibula is free. Help it grow.</div>
			</div>
		</div>
		<a class="donate-btn" href="javascript:showDonate()" data-t="button">Donate</a>
	</div>

</div>

<!-- Only used to find out the language of the app: this text is translated by the app. -->
<span id="probe" hidden>{{ Subscribe to Tor Newsletter }}</span>

<script>
function hideDonate() {
	var card = document.getElementById('donate');

	if (card) {
		card.style.display = 'none';
	}

	try {
		localStorage.setItem('cibulaDonateHidden', '1');
	}
	catch (e) {}
}

(function () {
	try {
		if (localStorage.getItem('cibulaDonateHidden') === '1') {
			hideDonate();
		}
	}
	catch (e) {}

	var probe = (document.getElementById('probe') || {}).textContent || '';
	var lang = /[іїєґІЇЄҐ]/.test(probe) ? 'uk' : (/[а-яёА-ЯЁ]/.test(probe) ? 'ru' : 'en');

	var texts = {
		en: { title: 'Support Cibula', text: 'Cibula is free. Help it grow.', button: 'Donate' },
		ru: { title: 'Поддержать Cibula', text: 'Cibula бесплатна. Помогите ей расти.', button: 'Пожертвовать' },
		uk: { title: 'Підтримати Cibula', text: 'Cibula безкоштовна. Допоможіть їй рости.', button: 'Пожертвувати' }
	};

	var nodes = document.querySelectorAll('[data-t]');

	for (var i = 0; i < nodes.length; i++) {
		nodes[i].textContent = texts[lang][nodes[i].getAttribute('data-t')];
	}
})();
</script>
</body>
</html>
