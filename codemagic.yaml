workflows:
  cibula-ipa:
    name: Cibula IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install pods
        script: pod install --repo-update
      - name: Fetch Tor.framework
        script: git clone --depth 1 https://github.com/iCepa/Tor.framework.git ../Tor.framework
      - name: Prepare version.h
        script: |
          if [ ! -f OnionBrowser/version.h ]; then
            printf '/* placeholder generated in CI */\n' > OnionBrowser/version.h
          fi
      - name: Rename to Cibula
        script: |
          find . -type f \( -name "*.swift" -o -name "*.m" -o -name "*.h" -o -name "*.strings" -o -name "*.stringsdict" -o -name "*.plist" -o -name "*.html" \) \
            -not -path "./.git/*" -not -path "./build/*" -not -path "*.xcodeproj/*" -print0 \
            | xargs -0 perl -pi -e 's/Onion Browser/Cibula/g; s/ONION BROWSER/CIBULA/g'
      - name: Dark purple launch screen
        script: |
          write_storyboard () {
            cat > "$1" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="23727" targetRuntime="iOS.CocoaTouch" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" useTraitCollections="YES" useSafeAreas="YES" colorMatched="YES" initialViewController="01J-lp-oVM">
              <device id="retina6_1" orientation="portrait" appearance="light"/>
              <dependencies>
                  <deployment identifier="iOS"/>
                  <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="23721"/>
                  <capability name="Safe area layout guides" minToolsVersion="9.0"/>
                  <capability name="documents saved in the Xcode 8 format" minToolsVersion="8.0"/>
              </dependencies>
              <scenes>
                  <scene sceneID="EHf-IW-A2E">
                      <objects>
                          <viewController id="01J-lp-oVM" sceneMemberID="viewController">
                              <view key="view" contentMode="scaleToFill" id="Ze5-6b-2t3">
                                  <rect key="frame" x="0.0" y="0.0" width="414" height="896"/>
                                  <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                                  <viewLayoutGuide key="safeArea" id="6Tk-OE-BBY"/>
                                  <color key="backgroundColor" red="0.050980392156862744" green="0.0" blue="0.098039215686274508" alpha="1" colorSpace="custom" customColorSpace="sRGB"/>
                              </view>
                          </viewController>
                          <placeholder placeholderIdentifier="IBFirstResponder" id="iYj-Kq-Ea1" userLabel="First Responder" sceneMemberID="firstResponder"/>
                      </objects>
                      <point key="canvasLocation" x="53" y="375"/>
                  </scene>
              </scenes>
          </document>
          EOF
          }
          write_xib () {
            cat > "$1" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.XIB" version="3.0" toolsVersion="23727" targetRuntime="iOS.CocoaTouch" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" useTraitCollections="YES" useSafeAreas="YES" colorMatched="YES">
              <device id="retina6_1" orientation="portrait" appearance="light"/>
              <dependencies>
                  <deployment identifier="iOS"/>
                  <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="23721"/>
                  <capability name="Safe area layout guides" minToolsVersion="9.0"/>
                  <capability name="documents saved in the Xcode 8 format" minToolsVersion="8.0"/>
              </dependencies>
              <objects>
                  <placeholder placeholderIdentifier="IBFilesOwner" id="-1" userLabel="File's Owner"/>
                  <placeholder placeholderIdentifier="IBFirstResponder" id="-2" customClass="UIResponder"/>
                  <view contentMode="scaleToFill" id="iN0-l3-epB">
                      <rect key="frame" x="0.0" y="0.0" width="414" height="896"/>
                      <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                      <viewLayoutGuide key="safeArea" id="vUN-kp-3ea"/>
                      <color key="backgroundColor" red="0.050980392156862744" green="0.0" blue="0.098039215686274508" alpha="1" colorSpace="custom" customColorSpace="sRGB"/>
                      <point key="canvasLocation" x="47" y="375"/>
                  </view>
              </objects>
          </document>
          EOF
          }
          find . \( -iname "*launch*.storyboard" -o -iname "*launch*.xib" \) \
            -not -path "./Pods/*" -not -path "./build/*" -not -path "./.git/*" -print0 \
            | while IFS= read -r -d '' f; do
                case "$f" in
                  *.storyboard) write_storyboard "$f" ;;
                  *.xib) write_xib "$f" ;;
                esac
                echo "Launch screen replaced: $f"
              done
          echo "Launch keys in Info.plist:"
          grep -n -i "launch" Resources/Info.plist 2>/dev/null | head -n 10 || true
      - name: Purple accent colors
        script: |
          write_color () {
            cat > "$1/Contents.json" <<EOF
          {
            "colors" : [
              {
                "color" : {
                  "color-space" : "srgb",
                  "components" : { "alpha" : "1.000", "red" : "$2", "green" : "$3", "blue" : "$4" }
                },
                "idiom" : "universal"
              }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF
          }
          FOUND=0
          for d in $(find . -type d -iname "*accent*.colorset" -not -path "./Pods/*" -not -path "./build/*"); do
            FOUND=1
            case "$(basename "$d" | tr 'A-Z' 'a-z')" in
              *light*) write_color "$d" 0.790 0.600 1.000 ;;
              *) write_color "$d" 0.545 0.173 0.961 ;;
            esac
            echo "Recolored: $d"
          done
          [ "$FOUND" = "0" ] && echo "No accent colorsets found" || true
      - name: Build unsigned app
        script: |
          xcodebuild -quiet \
            -workspace OnionBrowser.xcworkspace \
            -scheme OnionBrowser \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            MARKETING_VERSION=1.0 CURRENT_PROJECT_VERSION=1 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "===== ERRORS ====="
            grep -n -E "error:|BUILD FAILED" build.log | head -n 20
            exit $STATUS
          fi
      - name: Package IPA
        script: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n1)
          for P in "$APP/Info.plist" "$APP"/PlugIns/*.appex/Info.plist "$APP"/Extensions/*.appex/Info.plist; do
            [ -f "$P" ] || continue
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0" "$P" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0" "$P"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1" "$P" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 1" "$P"
            echo "Version patched: $P"
          done
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Cibula.ipa Payload
          cp Cibula.ipa Cibula-ipa.zip
    artifacts:
      - Cibula-ipa.zip
